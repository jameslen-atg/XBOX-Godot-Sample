name: GDK Release Watch Checks

# Validates the GDK release watcher (gdk-release-watch.yml), the agentic
# assessor (gdk-release-assess.md), and the deterministic helpers
# (tools/ci/gdk_*.cjs). Deterministic only: no model calls, no secrets.
#   * helper-tests  -- node:test suites for discovery and assessment.
#   * compile-drift -- recompiles the assessor with the pinned gh-aw version and
#                      fails if the committed .lock.yml differs.
#                      Uses only the read-only GITHUB_TOKEN to download gh-aw.
#
# See docs/ci/gdk-release-watch.md.

on:
  pull_request:
    paths:
      - 'tools/ci/gdk_release_*'
      - 'tools/ci/tests/gdk_*'
      - '.github/workflows/gdk-release-*'
      - '.github/aw/**'
  push:
    branches: [main]
    paths:
      - 'tools/ci/gdk_release_*'
      - 'tools/ci/tests/gdk_*'
      - '.github/workflows/gdk-release-*'
      - '.github/aw/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdk-release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helper-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Run helper tests
        run: >-
          node --test
          tools/ci/tests/gdk_release_watch.test.cjs
          tools/ci/tests/gdk_release_assess.test.cjs

  compile-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Keep in sync with the gh-aw version recorded in gdk-release-assess.lock.yml.
      GH_AW_VERSION: v0.89.21
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - name: Install gh-aw
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin "$GH_AW_VERSION"
      - name: Recompile and check for drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh aw compile gdk-release-assess --strict
          if ! git diff --exit-code -- .github/workflows/gdk-release-assess.lock.yml .github/aw/; then
            echo "::error::gdk-release-assess.lock.yml is out of date. Run 'gh aw compile gdk-release-assess --strict' with gh-aw $GH_AW_VERSION and commit the result."
            exit 1
          fi
